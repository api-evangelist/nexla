oauth:
  rest_api: false
  mcp: true
  detail: >-
    The REST API does not use OAuth. The MCP surface does, for clients that cannot send a custom header.
    RFC 9728 Protected Resource Metadata is served at
    https://api-genai.nexla.io/.well-known/oauth-protected-resource with scopes_supported
    [openid, email, profile] and bearer_methods_supported [header]. Upstream identity bridges are
    declared in the GenAI contract at /mcp/auth/google/callback and /mcp/auth/azure/callback.
  scopes_artifact: null
  scopes_note: >-
    No `scopes/` artifact is emitted. derive-oauth-scopes.py found zero oauth2 securitySchemes in either
    contract, and the only scopes Nexla publishes are the three standard OIDC scopes above — an identity
    surface, not an API permission model. Nexla's authorization model is role-based accessors
    (AccessRoles bound per resource), not OAuth scopes.
