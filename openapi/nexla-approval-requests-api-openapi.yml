openapi: 3.2.0
info:
  version: v1
  title: Nexla Rest Approval Requests API
  termsOfService: https://nexla.com/terms-of-service/
  contact:
    name: Nexla Support
    url: https://docs.nexla.com
    email: support@nexla.com
  license:
    name: Nexla
    url: https://nexla.com
  x-logo:
    url: https://cdn.nexla.io/ui/assets/brand/v2/nexla-logo-color-portrait.svg
    backgroundColor: '#ffffff'
  description: '# Introduction


    The Nexla API is a REST-ful API used to easily create and manage resources in Nexla in ways that best fit any use case.'
servers:
- url: https://{nexla-api-host}
  variables:
    nexla-api-host:
      default: dataops.nexla.io/nexla-api
      description: Nexla API URL your Nexla instance
security:
- NexlaSessionToken: []
tags:
- name: Approval Requests
  description: Operations for managing all requests made by users without permissions.
paths:
  /approval_requests/pending:
    get:
      tags:
      - Approval Requests
      operationId: get_pending_approval_requests
      summary: Get all pending approval requests
      description: Use this endpoint to fetch all pending approval requests that are not assigned to any users.
      parameters:
      - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/approval_requests_many'
        '403':
          description: Forbidden
  /approval_requests/requested:
    get:
      tags:
      - Approval Requests
      operationId: get_requested_approval_requests
      summary: Get all requested approval requests by the user
      description: Use this endpoint to fetch all approval requests that are requested by the user.
      parameters:
      - $ref: '#/components/parameters/accept'
      responses:
        '200':
          $ref: '#/components/responses/approval_requests_many'
        '403':
          description: Forbidden
  /approval_requests/{request_id}/approve:
    put:
      tags:
      - Approval Requests
      operationId: approve_approval_request
      summary: Approve pending approval requests
      description: Use this endpoint to approve pending approval requests that are assigned to user or it's unassigned.
      parameters:
      - $ref: '#/components/parameters/accept'
      - name: request_id
        in: path
        description: The unique ID of the Approval Request that needs to be approved.
        required: true
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/approval_requests_one'
        '403':
          description: Forbidden
  /approval_requests/{request_id}/reject:
    delete:
      tags:
      - Approval Requests
      operationId: reject_approval_request
      summary: Reject pending approval requests
      description: Use this endpoint to reject pending approval requests that are assigned to user or it's unassigned.
      parameters:
      - $ref: '#/components/parameters/accept'
      - name: request_id
        in: path
        description: The unique ID of the Approval Request that needs to be approved.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/vnd.nexla.api.v1+json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Successfully deleted
        '403':
          description: Forbidden
components:
  schemas:
    ApprovalRequest:
      type: object
      properties:
        id:
          type: integer
        org_id:
          type: integer
        request_type:
          type: string
        topic_id:
          type: integer
        status:
          type: string
        requestor_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        assignee_id:
          type: integer
        rejection_reason:
          type: string
  parameters:
    accept:
      name: Accept
      in: header
      schema:
        type: string
        enum:
        - application/vnd.nexla.api.v1+json
        - application/json
        description: 'Setting to `application/vnd.nexla.api.v1+json` is recommended.

          '
  responses:
    approval_requests_one:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalRequest'
    approval_requests_many:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ApprovalRequest'
  securitySchemes:
    NexlaSessionToken:
      type: http
      scheme: Bearer
      bearerFormat: JWT
      description: "The first step in calling the Nexla API or Nexla CLI is to fetch a Session access token by logging on to your Nexla UI instance. This ensures that your authentication is performed through your organization's preferred Identity Provider.\n\nTo fetch an access token from the Nexla UI, simply go to your Nexla UI instance, and try the route `/token`. For example, if your Nexla UI instance is at `https://dataops.nexla.io`, open `https://dataops.nexla.io/token` in the browser. \n\nThis will automatically route you to a login page, ask you to authenticate using your preferred Identity Provider, and, upon successful authentication, route you to a page where you can copy the Access Token.\n\nUsage format: `Bearer <JWT>`.\n"
    NexlaApiKeyQuery:
      type: apiKey
      name: api_key
      in: query
      description: '> **Important:** Never share your API keys. Keep them guarded and secure. If you think the key has been compromised, you can rotate the API key by calling relevant API Key management endpoints.


        The platform generates a unique API key for this resource. Add the API key as a query parameter to authenticate this request.

        Usage: `?api_key=<api-key>`

        '
    NexlaApiKeyHeader:
      type: http
      scheme: Basic
      description: '> **Important:** Never share your API keys. Keep them guarded and secure. If you think the key has been compromised, you can rotate the API key by calling relevant API Key management endpoints.


        The platform generates a unique API key for this resource. Add the API key as an authorization header to authenticate this request.

        Usage format: `Basic <api-key>`

        '
    basicAuth:
      type: http
      scheme: basic
    GoogleSSOToken:
      type: http
      scheme: Bearer
      bearerFormat: JWT
      description: 'The token that is used when logging into Nexla via Google SSO.

        '
x-tagGroups:
- name: Session
  tags:
  - Session Management
- name: Integrate
  tags:
  - Flows
  - Sources
  - Destinations (Data Sinks)
  - Nexsets (Data Sets)
  - Credentials
  - Data Maps
  - Code Containers
  - Transforms
  - Projects
- name: Monitor
  tags:
  - Notifications
  - Metrics
  - Audit Logs
  - Quarantine Settings
- name: Collaborate
  tags:
  - Access Control
- name: Account Management
  tags:
  - Organizations
  - Users
  - User Settings
  - Teams
  - Gen AI Configs
- name: Real-Time Events
  tags:
  - Webhooks
- name: Rate Limiting
  tags:
  - Limits
- name: Marketplace
  tags:
  - Marketplace
- name: Self Sign-Up
  tags:
  - Self Sign-Up
  - Self Sign-Up Admin
- name: Async Tasks
  tags:
  - Async Tasks
