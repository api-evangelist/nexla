components:
  schemas:
    RequestTeamAccessor:
      type: object
      properties:
        type:
          type: string
          enum:
          - TEAM
          description: "Choose this option if the access permissions should be granted to a team.       \n"
        id:
          type: integer
          description: 'Unique ID of the team that should be granted this permission.

            '
    AccessorsMutable:
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/RequestUserAccessor'
        - $ref: '#/components/schemas/RequestTeamAccessor'
        - $ref: '#/components/schemas/RequestOrgAccessor'
      - type: object
        properties:
          access_roles:
            $ref: '#/components/schemas/AccessRoles'
    ResponseTeamAccessor:
      type: object
      properties:
        type:
          type: string
          enum:
          - TEAM
        name:
          type: string
    AccessRoles:
      type: array
      description: "This property reflects all the permissions the user/team/organization has to this resource. \n\n1. `collaborator`: The user/team/organization can view the resource but not make any modifications to it.\n2. `operator`: The user/team/organization can view the resource and can activate/pause it, but not make any other modifications to it.\n3. `administrator`: The user/team/organization has complete administrative rights to this resource.\n4. `owner`: This user created the resource and so has complete administrative rights to it. \n"
      items:
        type: string
        enum:
        - owner
        - collaborator
        - operator
        - admin
    AccessorsResponseSchema:
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/ResponseOrgAccessor'
        - $ref: '#/components/schemas/ResponseTeamAccessor'
        - $ref: '#/components/schemas/ResponseUserAccessor'
      - type: object
        properties:
          access_roles:
            $ref: '#/components/schemas/AccessRoles'
          created_at:
            type: string
            format: date-time
            example: '2021-04-06T21:02:17.000Z'
          updated_at:
            type: string
            format: date-time
            example: '2021-04-06T21:02:17.000Z'
    AccessorsRequestSchema:
      type: object
      properties:
        accessors:
          type: array
          items:
            $ref: '#/components/schemas/AccessorsMutable'
    RequestUserAccessor:
      type: object
      properties:
        type:
          type: string
          enum:
          - USER
          description: "Choose this option if the access permissions should be granted to a user. \n\n>  Note: Users can belong to multiple organizations. The platform allows granting access permission across organization boundaries only for Nexset `sharer` access role. \n"
        id:
          type: integer
          description: "Unique ID of the user that should be granted this permission. \n"
        email:
          type: string
          example: example@nexla.com
          description: "`Optional`: Only user-id or email is required to identify the user who should be granted this access permission.  \n"
        org_id:
          type: integer
          description: 'Users can belong to multiple organizations. Specify the org_id to explicitly set the organization context for this access permission. If this is not specified the platform will try to automatically assign the permission to the user''s default organization (when granting sharer access on a Nexset) or to the current organization (for all other access roles).

            '
    RequestOrgAccessor:
      type: object
      properties:
        type:
          type: string
          enum:
          - ORG
          description: "Choose this option if the access permissions should be granted to an entire organization.      \n"
        id:
          type: integer
          description: 'Unique ID of the organization that should be granted this permission.

            '
    ResponseUserAccessor:
      type: object
      properties:
        type:
          type: string
          enum:
          - USER
        email:
          type: string
          example: example@nexla.com
    ResponseOrgAccessor:
      type: object
      properties:
        type:
          type: string
          enum:
          - ORG
        email_domain:
          type: string
          example: nexla.com
        client_identifier:
          type: string
          format: nullable
  responses:
    accessors_list:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AccessorsResponseSchema'
  securitySchemes:
    NexlaSessionToken:
      type: http
      scheme: Bearer
      bearerFormat: JWT
      description: "The first step in calling the Nexla API or Nexla CLI is to fetch a Session access token by logging on to your Nexla UI instance. This ensures that your authentication is performed through your organization's preferred Identity Provider.\n\nTo fetch an access token from the Nexla UI, simply go to your Nexla UI instance, and try the route `/token`. For example, if your Nexla UI instance is at `https://dataops.nexla.io`, open `https://dataops.nexla.io/token` in the browser. \n\nThis will automatically route you to a login page, ask you to authenticate using your preferred Identity Provider, and, upon successful authentication, route you to a page where you can copy the Access Token.\n\nUsage format: `Bearer <JWT>`.\n"
    NexlaApiKeyQuery:
      type: apiKey
      name: api_key
      in: query
      description: '> **Important:** Never share your API keys. Keep them guarded and secure. If you think the key has been compromised, you can rotate the API key by calling relevant API Key management endpoints.


        The platform generates a unique API key for this resource. Add the API key as a query parameter to authenticate this request.

        Usage: `?api_key=<api-key>`

        '
    NexlaApiKeyHeader:
      type: http
      scheme: Basic
      description: '> **Important:** Never share your API keys. Keep them guarded and secure. If you think the key has been compromised, you can rotate the API key by calling relevant API Key management endpoints.


        The platform generates a unique API key for this resource. Add the API key as an authorization header to authenticate this request.

        Usage format: `Basic <api-key>`

        '
    basicAuth:
      type: http
      scheme: basic
    GoogleSSOToken:
      type: http
      scheme: Bearer
      bearerFormat: JWT
      description: 'The token that is used when logging into Nexla via Google SSO.

        '
