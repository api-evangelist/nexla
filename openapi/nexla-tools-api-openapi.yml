components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ExecuteIn:
      properties:
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          title: Version
        args:
          additionalProperties: true
          type: object
          title: Args
        tool_set_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tool Set Id
          description: Toolset this call should be attributed to for metrics. Must belong to the caller's org. If omitted, the call is attributed to the org's sandbox toolset instead of every toolset the tool happens to be registered in.
      additionalProperties: false
      type: object
      required:
      - version
      title: ExecuteIn
    ReconcileIn:
      properties:
        mode:
          type: string
          const: changed_since
          title: Mode
          default: changed_since
        since:
          type: string
          format: date-time
          title: Since
      additionalProperties: false
      type: object
      required:
      - since
      title: ReconcileIn
    ToolUpdateIn:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 512
            minLength: 1
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Description
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
        runtime_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Runtime Config
      additionalProperties: false
      type: object
      title: ToolUpdateIn
      description: Input schema for updating a tool.
    FromNexsetIn:
      properties:
        nexset_id:
          type: integer
          minimum: 1.0
          title: Nexset Id
        publish:
          type: boolean
          title: Publish
          default: false
      additionalProperties: false
      type: object
      required:
      - nexset_id
      title: FromNexsetIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
