openapi: 3.2.0
info:
  title: Nexla GenAI (RAG + MCPaaS) Clear Dataset Cache API
  description: Combined Nexla GenAI RAG API Service and MCPaaS
  version: v0.2.3.3-combined
tags:
- name: Clear Dataset Cache
paths:
  /clear-dataset-cache:
    post:
      summary: Clear Dataset Cache
      operationId: clear_dataset_cache_clear_dataset_cache_post
      parameters:
      - name: token_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TokenType'
          default: service_key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearCacheRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Clear Dataset Cache
components:
  schemas:
    ClearCacheRequest:
      properties:
        nexset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Nexset Id
        clear_all:
          type: boolean
          title: Clear All
          default: false
      type: object
      title: ClearCacheRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TokenType:
      type: string
      enum:
      - bearer
      - service_key
      title: TokenType
