openapi: 3.2.0
info:
  title: Nexla GenAI (RAG + MCPaaS) Data Sets API
  description: Combined Nexla GenAI RAG API Service and MCPaaS
  version: v0.2.3.3-combined
tags:
- name: Data Sets
paths:
  /data_sets/{nexset_id}/semantic_schema:
    post:
      summary: Get Semantic Schema
      operationId: get_semantic_schema_data_sets__nexset_id__semantic_schema_post
      parameters:
      - name: nexset_id
        in: path
        required: true
        schema:
          type: string
          title: Nexset Id
      - name: nexla_dataset_updated
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Nexla Dataset Updated
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Data Sets
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
