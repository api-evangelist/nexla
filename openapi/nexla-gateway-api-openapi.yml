components:
  schemas:
    ExtMcpServerUpdateIn:
      properties:
        server_name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Server Name
        server_description:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Server Description
        server_url:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Server Url
        status:
          anyOf:
          - type: string
            enum:
            - active
            - inactive
            - error
            - auth_error
          - type: 'null'
          title: Status
        mcp_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Mcp Config
        tool_filter:
          anyOf:
          - $ref: '#/components/schemas/ToolFilterIn'
          - type: 'null'
          description: Update the tool filter for this server. Set to an empty object to clear the filter and sync all tools.
      additionalProperties: false
      type: object
      title: ExtMcpServerUpdateIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    GatewaySearchIn:
      properties:
        search_term:
          type: string
          maxLength: 2048
          minLength: 1
          title: Search Term
        limit:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Limit
          default: 10
      additionalProperties: false
      type: object
      required:
      - search_term
      title: GatewaySearchIn
    ToolFilterIn:
      properties:
        mode:
          type: string
          enum:
          - include
          - exclude
          title: Mode
          description: 'Filter mode: ''include'' syncs only matching tools, ''exclude'' syncs all except matching.'
          default: include
        tool_names:
          items:
            type: string
          type: array
          title: Tool Names
          description: Exact original tool names (as reported by the remote MCP server) to match.
        patterns:
          items:
            type: string
          type: array
          title: Patterns
          description: 'Glob patterns matched against original tool names. Supported wildcards: ''*'' matches any sequence of characters, ''?'' matches exactly one character. Bracket expressions like ''[abc]'' are NOT supported. Examples: ''github_*'', ''*_readonly'', ''tool_?''.'
      additionalProperties: false
      type: object
      title: ToolFilterIn
      description: 'Optional filter for selecting a subset of tools from an external MCP server.


        When ``mode`` is ``"include"``, only tools matching ``tool_names`` or

        ``patterns`` are synced.  When ``mode`` is ``"exclude"``, all tools

        *except* those matching are synced.'
    ExtMcpServerCreateIn:
      properties:
        server_name:
          type: string
          maxLength: 255
          minLength: 1
          title: Server Name
        server_description:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Server Description
        server_url:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Server Url
        mcp_config:
          additionalProperties: true
          type: object
          title: Mcp Config
        tool_filter:
          anyOf:
          - $ref: '#/components/schemas/ToolFilterIn'
          - type: 'null'
          description: Optional filter to select a subset of tools from the external MCP server. When omitted, all tools discovered on the server are synced.
      additionalProperties: false
      type: object
      required:
      - server_name
      - mcp_config
      title: ExtMcpServerCreateIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
