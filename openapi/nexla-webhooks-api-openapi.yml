openapi: 3.2.0
info:
  version: v1
  title: Nexla Rest Webhooks API
  termsOfService: https://nexla.com/terms-of-service/
  contact:
    name: Nexla Support
    url: https://docs.nexla.com
    email: support@nexla.com
  license:
    name: Nexla
    url: https://nexla.com
  x-logo:
    url: https://cdn.nexla.io/ui/assets/brand/v2/nexla-logo-color-portrait.svg
    backgroundColor: '#ffffff'
  description: '# Introduction


    The Nexla API is a REST-ful API used to easily create and manage resources in Nexla in ways that best fit any use case. It can be used to configure and monitor data flows for different data-integration use cases and to perform all aspects of data engineering automation offered by the Nexla platform.


    The Nexla API supports all data flow-creation and -management actions in the platform, as well as administrative user- and organization-level account-management tasks. Note that all other client packages, such as the Nexla CLI and Nexla UI, also connect to the overall Nexla infrastructure through the Nexla API.


    The API references in this document lists all API endpoints and the corresponding payloads.


    Check out the [API Developer Guides](https://developers.nexla.com/docs/nexla-api) to view guides and tutorials for recommended use cases for different endpoints.


    # API Data Format and Versions


    The API uses JSON for all data exchanges.


    You __should__ specify the API version that should be used in the Accept header of each request. For example, to access Version 1 of the API, the Accept header should be the following:

    ```

    Accept: application/vnd.nexla.api.v1+json

    ```


    The Nexla API also supports a generic version header, which will default your access to the latest version of the data source/destination API.



    ```

    Accept: application/json

    ```


    # Authentication


    Most Nexla API endpoints require `Bearer Token` authentication mechanism for making an authenticated request to the API. While this token can be generated programmatically outside Nexla UI by starting a session with an `api_key`, unless unavoidable, we recommend starting your session from the Nexla UI and using the `Nexla Session Token` from the Nexla UI as the Authorization header for calls to the Nexla API.


    <SecurityDefinitions />'
servers:
- url: https://{nexla-api-host}
  variables:
    nexla-api-host:
      default: dataops.nexla.io/nexla-api
      description: Nexla API URL your Nexla instance
security:
- NexlaSessionToken: []
tags:
- name: Webhooks
  description: Operations for sending events to the Nexla `webhook` connector.
paths: {}
webhooks:
  send_one_record:
    post:
      summary: Send one record to Webhook
      operationId: send_one_record
      tags:
      - Webhooks
      security:
      - NexlaApiKeyQuery: []
      - NexlaApiKeyHeader: []
      parameters:
      - name: include_headers
        in: path
        description: "Set this to `true` if you wish to send any custom headers to be included in the ingested records as part of the request. \n\nThe platform will ignore standard headers like `Authorization` and `Content-Type`. Any custom headers will be added as a `header_<header_name>` attribute in the record.\n\nExample: The request header `NEX-HEADER: test` will be ingested as the attribute `header_NEX-HEADER` with the value `test`.\n\nDefault value: `false`\n"
        schema:
          type: boolean
      - name: include_url_params
        in: path
        description: "Set this to `true` if you wish to send any custom query parameters to be included in the ingested records as part of the request. \n\nThe platform will ignore standard query parameters like `api_key`. Any custom query parameters will be added as a `url_param_<param_name>` attribute in the record.\n\nExample: The request query parameter `abc=def` will be ingested as the attribute `url_param_abc` with the value `def`.\n\nDefault value: `false`\n"
        schema:
          type: boolean
      - name: force_schema_detection
        in: path
        description: "Usually, the platform performs Nexset schema detection only for the first few records from a new webhook. This is to avoid any unnecessary latencies in webhook record processing. \n\nSet this to `true` if you wish to enforce any webhook event to trigger schema detection. \n\nDefault value: `false`\n"
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nexset_record'
            example:
              id: 1
              name: one
          application/xml:
            schema:
              type: object
              properties:
                root:
                  $ref: '#/components/schemas/nexset_record'
                  xml:
                    name: root
                    wrapped: true
            example: "<root>\n  <id>1</id>\n  <name>one</name>\n</root>\n"
      responses:
        '200':
          description: Returns the 200 status to indicate that data was received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId:
                    type: integer
                    description: Nexset ID of the Nexset to which this record is sent.
                  processed:
                    type: integer
                    description: Number of records successfully processed by Nexla.
        '403':
          description: Request failed authentication
        '500':
          description: Returned when the service is not able to consume the data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "Descriptive text about the error reason. \n"
                    example: 'Source #1000 is PAUSED'
  send_many_records:
    post:
      summary: Send many records to Webhook
      description: 'Send an array of JSON objects. Nexla will treat each object as a unique record for the webhook.

        '
      operationId: send_many_records
      tags:
      - Webhooks
      security:
      - NexlaApiKeyQuery: []
      - NexlaApiKeyHeader: []
      parameters:
      - name: include_headers
        in: path
        description: "Set this to `true` if you wish to send any custom headers to be included in the ingested record as part of the request. \n\nThe platform will ignore standard headers like `Authorization` and `Content-Type`. Any custom headers will be added as a `header_<header_name>` attribute in the record.\n\nExample: The request header `NEX-HEADER: test`  will be ingested as the attribute `header_NEX-HEADER` with the value `test`.\n\nDefault value: `false`\n"
        schema:
          type: boolean
      - name: include_url_params
        in: path
        description: "Set this to `true` if you wish to send any custom query parameters to be included in the ingested records as part of the request. \n\nThe platform will ignore standard query parameters like `api_key`. Any custom query parameters will be added as a `url_param_<param_name>` attribute in the record.\n\nExample: The request query parameter `abc=def` will be ingested as the attribute `url_param_abc` with the value `def`.\n\nDefault value: `false`\n"
        schema:
          type: boolean
      - name: force_schema_detection
        in: path
        description: "Usually, the platform performs Nexset schema detection only for the first few records from a new webhook. This is to avoid any unnecessary latencies in webhook record processing. \n\nSet this to `true` if you wish to enforce any webhook event to trigger schema detection. \n\nDefault value: `false`\n"
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/nexset_record'
      responses:
        '200':
          description: Returns the 200 status to indicate that data was received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasetId:
                    type: integer
                    description: Nexset ID of the Nexset to which this record is sent.
                  processed:
                    type: integer
                    description: Number of records successfully processed by Nexla.
        '403':
          description: Request failed authentication
        '500':
          description: Returned when the service is not able to consume the data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "Descriptive text about the error reason. \n"
                    example: 'Source #1000 is PAUSED'
components:
  schemas:
    nexset_record:
      type: object
      additionalProperties:
        type: string
        x-additionalPropertiesName: attribute_name
        description: 'Property Name: Attribute name in the record.


          Property Value: Attribute value in the record.

          '
  securitySchemes:
    NexlaSessionToken:
      type: http
      scheme: Bearer
      bearerFormat: JWT
      description: "The first step in calling the Nexla API or Nexla CLI is to fetch a Session access token by logging on to your Nexla UI instance. This ensures that your authentication is performed through your organization's preferred Identity Provider.\n\nTo fetch an access token from the Nexla UI, simply go to your Nexla UI instance, and try the route `/token`. For example, if your Nexla UI instance is at `https://dataops.nexla.io`, open `https://dataops.nexla.io/token` in the browser. \n\nThis will automatically route you to a login page, ask you to authenticate using your preferred Identity Provider, and, upon successful authentication, route you to a page where you can copy the Access Token.\n\nUsage format: `Bearer <JWT>`.\n"
    NexlaApiKeyQuery:
      type: apiKey
      name: api_key
      in: query
      description: '> **Important:** Never share your API keys. Keep them guarded and secure. If you think the key has been compromised, you can rotate the API key by calling relevant API Key management endpoints.


        The platform generates a unique API key for this resource. Add the API key as a query parameter to authenticate this request.

        Usage: `?api_key=<api-key>`

        '
    NexlaApiKeyHeader:
      type: http
      scheme: Basic
      description: '> **Important:** Never share your API keys. Keep them guarded and secure. If you think the key has been compromised, you can rotate the API key by calling relevant API Key management endpoints.


        The platform generates a unique API key for this resource. Add the API key as an authorization header to authenticate this request.

        Usage format: `Basic <api-key>`

        '
    basicAuth:
      type: http
      scheme: basic
    GoogleSSOToken:
      type: http
      scheme: Bearer
      bearerFormat: JWT
      description: 'The token that is used when logging into Nexla via Google SSO.

        '
