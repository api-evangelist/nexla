openapi: 3.2.0
info:
  title: Nexla GenAI (RAG + MCPaaS) Bulk Evaluation API
  description: Combined Nexla GenAI RAG API Service and MCPaaS
  version: v0.2.3.3-combined
tags:
- name: Bulk Evaluation
paths:
  /bulk_evaluation:
    post:
      summary: Bulk Evaluation
      operationId: bulk_evaluation_bulk_evaluation_post
      parameters:
      - name: token_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TokenType'
          default: service_key
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_bulk_evaluation_bulk_evaluation_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Bulk Evaluation
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_bulk_evaluation_bulk_evaluation_post:
      properties:
        csv_file:
          type: string
          contentMediaType: application/octet-stream
          title: Csv File
        ai_model:
          type: string
          title: Ai Model
        llm_provider:
          type: string
          title: Llm Provider
        streaming:
          type: boolean
          title: Streaming
          default: false
        batch_size:
          type: integer
          title: Batch Size
          default: 10
      type: object
      required:
      - csv_file
      - ai_model
      - llm_provider
      title: Body_bulk_evaluation_bulk_evaluation_post
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TokenType:
      type: string
      enum:
      - bearer
      - service_key
      title: TokenType
