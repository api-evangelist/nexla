openapi: 3.2.0
info:
  title: Nexla GenAI (RAG + MCPaaS) Clear Token Cache API
  description: Combined Nexla GenAI RAG API Service and MCPaaS
  version: v0.2.3.3-combined
tags:
- name: Clear Token Cache
paths:
  /clear-token-cache/{api_key}:
    post:
      summary: Clear Token Cache
      description: "Clear a specific token from the cache.\nArgs:\n    api_key: The API key to remove from the cache\n    auth_response: Authentication response from the request\nReturns:\n    JSONResponse: Response indicating success or failure"
      operationId: clear_token_cache_clear_token_cache__api_key__post
      parameters:
      - name: api_key
        in: path
        required: true
        schema:
          type: string
          title: Api Key
      - name: token_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TokenType'
          default: service_key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Clear Token Cache
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TokenType:
      type: string
      enum:
      - bearer
      - service_key
      title: TokenType
