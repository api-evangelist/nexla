    rationale: 'Nexla provisions users, teams and orgs and supports enterprise SSO — SCIM is the identity-provisioning standard for that market.'
    found: false
  - standard: OpenLineage
    rationale: 'The de facto lineage event standard for data pipelines; Nexla tracks flow lineage.'
    found: false
  - standard: Open Data Contract Standard (Bitol/ODCS)
    rationale: "Nexla's Nexset is a data-product abstraction; ODCS is the emerging data-product contract standard."
    found: false
  - standard: OData
    rationale: 'Common query standard for data-serving APIs.'
    found: false
  - standard: CloudEvents
    rationale: 'Standard event envelope for the streaming/CDC surface.'
    found: false
  verdict: >-
    No domain standard is declared in either contract. The one standard Nexla's own contract DOES speak
    natively is the agent-side pair MCP + RFC 9728, which is a cross-cutting agent standard rather than a
    data-integration domain standard. REWARD-ONLY check: nothing is invented to fill the slot.
