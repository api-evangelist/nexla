summary: >-
  Entity graph derived from the 312 component schemas and the id-reference fields in the Nexla REST
  OpenAPI. Nexla's core object is the FLOW, a directed graph of nodes: a data_source ingests, one or more
  data_sets (Nexsets) shape, and one or more data_sinks deliver. Every resource is owned by a user and
  scoped to an org, and every resource carries an accessors collection that is the access-control join.
identifiers:
  scheme: integer surrogate keys
  note: >-
    Nexla uses plain integer ids (source_id, set_id, sink_id, flow_id, org_id, …), NOT prefixed opaque
    ids. There is no type prefix in an id, so an id alone does not tell an agent which resource it names —
    the path segment does.
entities:
