  - "/orgs/{org_id}/auth_settings"
  relationships:
  - {type: has_many, target: user, via: members}
  - {type: has_many, target: team, via: org_id}
  - {type: has_one, target: user, via: billing_owner_id, role: billing owner}
- name: user
  description: Account principal. Owns resources, belongs to orgs and teams.
  paths:
  - "/users"
  - "/users/{user_id}"
  - "/users/{user_id}/quarantine_settings"
  relationships:
  - {type: belongs_to, target: org, via: default_org_id}
  - {type: has_many, target: team, via: membership}
