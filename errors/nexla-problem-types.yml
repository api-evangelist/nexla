problem_types:
- code: AUTH_001
  title: Unauthorized
  detail: 'Invalid or expired access token'
  status: 401
  remediation: Refresh the token or re-authenticate.
- code: AUTH_002
  title: Invalid credentials
  detail: 'Service key is invalid or has been revoked'
  status: 401
  remediation: Verify the service key and re-authenticate; rotate if compromised.
- code: AUTH_003
  title: Token expired
  detail: 'Access token has expired'
  status: 401
  remediation: >-
    Session tokens live ~1 hour. Exchange the service key for a fresh session token, or call
    NexlaClient.refresh_access_token() in the Python SDK.
- code: AUTH_004
  title: Insufficient permissions
  detail: 'User lacks required permissions'
  status: 403
  remediation: Verify organization membership and resource accessor grants, or contact an administrator.
- code: RATE_001
  title: Rate limit exceeded
  detail: 'Too many requests in specified time period'
  status: 429
  remediation: Back off; honour Retry-After where present. See rate-limits/nexla-rate-limits.yml.
- code: VAL_001
  title: Validation failed
  detail: 'Request validation issues with specific field details'
  status: 400
  remediation: Read `details` for the offending fields and correct the payload.
gaps:
- >-
  403 is declared on 248 of 274 operations and 401 on 168, but only ONE operation declares a response
  body schema for any 4xx. The error envelope is documented in prose and absent from the contract, so a
  client generated from the OpenAPI alone cannot type its errors.
- No 429 or 5xx responses are declared anywhere in the REST OpenAPI.
