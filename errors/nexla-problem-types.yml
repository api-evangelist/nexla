format: custom-json
rfc9457: false
format_note: >-
  Nexla does NOT use RFC 9457 problem+json. Errors are a custom JSON envelope; only one operation in the
  274-operation REST spec declares an application/json body for a 4xx at all, so the envelope below comes
  from the documented error-handling reference rather than the contract.
envelope:
  media_type: application/json
  fields:
  - name: error
    description: Machine-readable error type.
  - name: error_description
    description: Human-readable description.
  - name: error_code
    description: Specific code for programmatic handling.
  - name: timestamp
    description: When the error occurred.
  - name: request_id
    description: Unique identifier for request tracking. Mirrors the x-request-id response header observed on live 401s.
  - name: details
    description: Additional context-specific information.
