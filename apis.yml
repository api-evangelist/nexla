- aid: nexla:nexla-code-containers-api
  name: Nexla Code Containers API
  description: "Code containers are a general-purpose resource in the platform for storing user-defined\
    \ functions that can be referenced by different modules for different purposes.\n\nThese containers\
    \ can either hold the code in the database or reference the repository where the code is saved.\n\n\
    Common use cases are - \n1. `transform` for code blocks that are used to transform Nexsets.\n2. `ai_function`\
    \ for code blocks that can be used for AI functions.\n\nFor convenience, in addition to allowing direct\
    \ access to any type of code_container, the API also provides some aliased versions of commonly used\
    \ types of code containers. For ex, all endpoints for `transforms` are just aliases to endpoints for\
    \ code_containers that can only be used for transforming Nexset record,"
  humanURL: https://docs.nexla.com/reference/nexla-api
