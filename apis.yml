apis:
- name: Nexla REST API
  description: >-
    RESTful control-plane API for the Nexla platform. 155 paths / 274 operations across 31 tags covering
    data flows, sources, Nexsets (data sets), sinks, credentials, data maps, transforms, code containers,
    custom runtimes, projects, users, teams, organizations, access control, approval requests,
    notifications, audit logs, async tasks, marketplace, metrics, quarantine settings and GenAI
    configurations. Also declares two OpenAPI 3.1 webhooks for record ingestion. Authenticated with a
    Bearer session token (JWT, ~1 hour) obtained from the Nexla UI /token route or exchanged from a
    permanent service key; per-resource API keys are also supported via Basic header or api_key query.
  humanURL: https://docs.nexla.com/reference/nexla-api
  baseURL: https://dataops.nexla.io/nexla-api
