- name: Nexla GenAI API (RAG + MCPaaS)
  description: >-
    OpenAPI 3.1 contract for Nexla's GenAI service, combining the Agentic RAG query API with MCPaaS —
    the MCP Tools control plane. 110 paths / 131 operations covering agentic RAG query and cache,
    per-nexset filter registration, org-level agent skills, tool and toolset lifecycle (create from
    Nexset, activate, pause, clone, sync), MCP exports and mcp_config, an MCP Gateway that registers and
    filters external MCP servers, audit receipts, session management and usage metrics. This is the
    service that serves Nexla's remote MCP endpoint.
  humanURL: https://docs.nexla.com/dev-guides/mcp-tools
  baseURL: https://api-genai.nexla.io
