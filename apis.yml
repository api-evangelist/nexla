aid: nexla
name: Nexla
description: >-
  Nexla is an enterprise data integration and AI-data platform, founded in 2016 and headquartered in
  San Mateo, California. Its core abstraction is the Nexset — a logical, schema-aware, bi-directionally
  usable data product that Nexla generates automatically from any connected system. The platform spans
  ETL/ELT, streaming and CDC, API ingestion and delivery, RAG pipelines and, since 2026, an MCP Tools
  layer (MCP Studio, MCP Gateway, Agentic Probe) that turns governed Nexsets into task-scoped MCP
  servers for AI agents. Nexla exposes two public machine-readable contracts: a 274-operation OpenAPI
  3.1 REST API covering flows, sources, Nexsets, sinks, credentials, transforms, projects, teams,
  organizations, access control, notifications, audit logs and metrics; and a 131-operation OpenAPI 3.1
  GenAI (RAG + MCPaaS) API covering agentic RAG, nexset filters, skills, tools, toolsets, MCP gateway
  and audit receipts. First-party clients ship as a Python SDK, a TypeScript/JS SDK, a React embedding
  SDK and a Python CLI. Nexla is SOC 2 Type II, HIPAA, GDPR and CCPA compliant.
